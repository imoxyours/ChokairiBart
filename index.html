<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chokairi Bart SARL | Raccords & accessoires irrigation</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="logo.png" alt="CB" class="logo" onerror="this.style.display='none'">
    <div><b>CHOKAIRI BART SARL</b><small data-t="tag"></small></div>
  </div>
  <div class="lang">
    <button data-lang="ar">العربية</button>
    <button data-lang="fr">Français</button>
  </div>
</header>

<main>
  <!-- زبون عائد -->
  <section id="s0" class="panel narrow hidden">
    <h1 id="hello"></h1>
    <p class="hint" data-t="back0"></p>
    <div class="me" id="meBox"></div>
    <button class="btn" id="cont" data-t="cont"></button>
    <button class="btn ghost" id="edit" data-t="edit"></button>
  </section>

  <!-- الخطوة 1 -->
  <section id="s1" class="panel narrow hidden">
    <h1 data-t="s1"></h1>
    <p class="hint" data-t="s1h"></p>
    <label><span data-t="name"></span><input id="cName" autocomplete="name"></label>
    <label><span data-t="phone"></span><input id="cPhone" type="tel" inputmode="tel" autocomplete="tel"></label>
    <label><span data-t="work"></span><input id="cWork"></label>
    <p class="err" id="err"></p>
    <button class="btn" id="next" data-t="next"></button>
  </section>

  <!-- الخطوة 2 -->
  <section id="s2" class="hidden">
    <div class="panel head"><h1 data-t="s2"></h1><p class="hint" data-t="s2h"></p></div>
    <div id="grid"></div>
    <div class="bar">
      <div class="sum"><span id="cnt">0</span> <span data-t="items"></span> · <b id="tot">0.00</b> DH</div>
      <button class="btn red" id="confirm" data-t="confirm"></button>
    </div>
  </section>

  <!-- الخطوة 3 -->
  <section id="s3" class="hidden">
    <div id="sheet" class="sheet"></div>
    <div class="actions">
      <button class="btn" id="cap"></button>
      <button class="btn wa" id="waTxt"></button>
      <button class="btn alt" id="mail"></button>
      <button class="btn ghost" id="back"></button>
    </div>
    <p class="hint center" data-t="sendHint"></p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
